name: Extract RxExam source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract cleaned RxExam source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="rxexam-clean-login-v4-manus-removed.zip"
          test -f "$ZIP"
          rm -rf /tmp/rxexam-source
          mkdir -p /tmp/rxexam-source
          unzip -q -o "$ZIP" -d /tmp/rxexam-source
          cp -a /tmp/rxexam-source/. .
          rm -f "$ZIP"
          rm -f README.md

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import cleaned RxExam source [skip ci]"
          git push
